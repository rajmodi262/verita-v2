# Full stack: Postgres, migrations, demo-pack load, API, job worker, web (nginx, same origin).
# Run from the repository root after `verita demo pack` (writes ./demo-pack) and creating a key:
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml run --rm api verita users seed-demo
# Then open http://localhost:8080. Observability (Prometheus + Grafana) is opt-in:
#   docker compose -f deploy/docker-compose.yml --profile observability up
name: verita

x-api-env: &api-env
  VERITA_ENV: prod
  # The API and the worker connect as a least-privilege role (no UPDATE/DELETE on the ledger,
  # audit log or signatures; owns nothing). `migrate` connects as the owner and grants it.
  VERITA_DATABASE_URL: postgresql+psycopg://verita_app:${VERITA_APP_DB_PASSWORD:-verita-app-local-only}@db:5432/verita
  VERITA_CORS_ORIGINS: '["http://localhost:8080"]'
  VERITA_DATASET: ${VERITA_DATASET:-hi_small}
  VERITA_DEMO_PACK: /srv/verita/demo-pack
  VERITA_SIGNING_KEY_PATH: /run/secrets/signing_key
  VERITA_PUBLIC_KEY_PATH: /tmp/verita-pub.pem
  VERITA_INLINE_JOBS: "false"
  VERITA_LLM_PROVIDERS: ${VERITA_LLM_PROVIDERS:-[]}
  # Comma-separated key pools in priority order (verita.defend.keypool); single keys still work.
  VERITA_GEMINI_API_KEYS: ${VERITA_GEMINI_API_KEYS:-}
  VERITA_GROQ_API_KEYS: ${VERITA_GROQ_API_KEYS:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  # Raise only for load tests (perf/load.js runs every virtual user from one IP).
  VERITA_RATE_LIMIT_PER_IP: ${VERITA_RATE_LIMIT_PER_IP:-600}
  VERITA_RATE_LIMIT_LOGIN_PER_IP: ${VERITA_RATE_LIMIT_LOGIN_PER_IP:-20}

x-api: &api
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: verita-api:local
  environment: *api-env
  volumes:
    - ../demo-pack:/srv/verita/demo-pack:ro
  secrets: [signing_key]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: verita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verita-local-only}
      POSTGRES_DB: verita
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verita -d verita"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api
    restart: "no"
    environment:
      <<: *api-env
      VERITA_DATABASE_URL: postgresql+psycopg://verita:${POSTGRES_PASSWORD:-verita-local-only}@db:5432/verita
      VERITA_APP_DB_PASSWORD: ${VERITA_APP_DB_PASSWORD:-verita-app-local-only}
    command:
      - sh
      - -c
      - >-
        verita db upgrade &&
        verita db app-role --role verita_app &&
        verita demo load --pack /srv/verita/demo-pack
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *api
    command: ["verita", "worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    image: verita-web:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

secrets:
  signing_key:
    file: ../keys/verita-signing.pem

volumes:
  pgdata:
