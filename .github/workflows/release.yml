name: Release

# Tag vX.Y.Z → images on GHCR, SBOMs, the vulnerability gate, and a GitHub release carrying the
# SBOMs and the Python distribution (which includes the offline `verita-verify`).
# The demo pack is built from the HI-Small dataset, which CI does not hold: the build machine
# attaches it with `deploy/prod/release-pack.sh vX.Y.Z` (it verifies the manifest first).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t "$REGISTRY/verita-api:$TAG" -f backend/Dockerfile .
          docker build -t "$REGISTRY/verita-web:$TAG" frontend
      - name: SBOMs + vulnerability gate (fixable High/Critical fail the release)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          for img in api web; do
            syft "$REGISTRY/verita-$img:$TAG" -o "cyclonedx-json=sbom-verita-$img.cdx.json"
            grype "sbom:sbom-verita-$img.cdx.json" --only-fixed --fail-on high
          done
      - name: Push images
        run: |
          docker push "$REGISTRY/verita-api:$TAG"
          docker push "$REGISTRY/verita-web:$TAG"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Python distribution
        run: uv build --directory backend --out-dir ../dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --title "Verita $TAG" --generate-notes \
            sbom-verita-api.cdx.json sbom-verita-web.cdx.json dist/*
