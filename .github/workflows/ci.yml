name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verita
          POSTGRES_PASSWORD: verita
          POSTGRES_DB: verita_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verita -d verita_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VERITA_TEST_DATABASE_URL: postgresql+psycopg://verita:verita@localhost:5432/verita_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev
      - name: Lint, format, types, tests (coverage gate 90%)
        run: uv run poe check
      - name: Security (bandit + pip-audit)
        run: uv run poe security
      - name: Honesty — generated docs match reports/metrics.json
        run: uv run verita report check
      - name: Honesty — no hand-typed metrics in docs or UI
        run: uv run verita report scan

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint, styles, format, types, tests
        run: npm run check
      - name: Coverage gate
        run: npx vitest run --coverage
      - name: Build
        run: npm run build
      - name: Bundle budgets (gzip, entry ≤ 135 KB, route chunks ≤ 150 KB)
        run: npm run bundle:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser end-to-end + accessibility
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Fixture stack + Playwright (demo path, keyboard, axe, phone width)
        run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Lighthouse budgets (production bundle via vite preview, fixture API)
        working-directory: frontend
        env:
          VERITA_DATABASE_URL: sqlite+pysqlite:///../backend/.e2e/e2e.sqlite
          VERITA_DATASET: fixture
          VERITA_SIGNING_KEY_PATH: ../backend/.e2e/signing.pem
          VERITA_PUBLIC_KEY_PATH: ../backend/.e2e/pub.pem
          VERITA_LLM_PROVIDERS: "[]"
          VERITA_API_URL: http://localhost:8011
          LHCI_BASE_URL: http://localhost:4173
        run: |
          npm run build
          (cd ../backend && uv run --no-sync uvicorn verita.api.app:create_app --factory --port 8011 &)
          npx vite preview --port 4173 --strictPort &
          npx -y wait-on@8.0.3 -t 60000 http://localhost:8011/api/v1/health/live http://localhost:4173
          npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pinned binary over the full history. (gitleaks-action scans `<first commit>^..`,
      # which fails on a repository's first push, when the first commit has no parent.)
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*"
          zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t verita-api:ci -f backend/Dockerfile .
      - name: Build web image
        run: docker build -t verita-web:ci frontend
      - name: Smoke-test the API image
        run: |
          docker run -d --name api -e VERITA_ENV=dev -e VERITA_DATABASE_URL=sqlite+pysqlite:////tmp/ci.sqlite -p 8000:8000 verita-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health/live && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: SBOMs (CycloneDX)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft verita-api:ci -o cyclonedx-json=sbom-verita-api.cdx.json
          syft verita-web:ci -o cyclonedx-json=sbom-verita-web.cdx.json
      - name: Vulnerability gate — fail on any fixable High/Critical (docs/SECURITY_EXCEPTIONS.md SE-3)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom-verita-api.cdx.json --only-fixed --fail-on high
          grype sbom:sbom-verita-web.cdx.json --only-fixed --fail-on high
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.cdx.json
